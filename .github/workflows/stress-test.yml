name: MMO Cluster Stepped Stress Test

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Целевой IP игрового сервера'
        required: true
        default: '93.77.168.135'
      port:
        description: 'Порт (строго 80)'
        required: true
        default: '80'
      start_ccu:
        description: 'Начальный онлайн ботов (CCU)'
        required: true
        default: '1000'
      max_ccu:
        description: 'Максимальный онлайн ботов (CCU)'
        required: true
        default: '5000'
      duration:
        description: 'Длительность каждой ступени (секунд, 300 = 5 минут)'
        required: true
        default: '300'

permissions:
  contents: write

jobs:
  stepped-benchmark:
    name: Stepped Load Test (1000 -> 5000 CCU)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Tune Linux TCP & Descriptors for 5000+ Sockets
        run: |
          ulimit -n 65535
          sudo sysctl -w fs.file-max=2097152 || true
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535" || true
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1 || true

      - name: Run Stepped Benchmark
        run: |
          node scripts/run-stepped-benchmarks.js \
            --host=${{ github.event.inputs.host }} \
            --port=${{ github.event.inputs.port }} \
            --start-ccu=${{ github.event.inputs.start_ccu }} \
            --max-ccu=${{ github.event.inputs.max_ccu }} \
            --duration=${{ github.event.inputs.duration }}

      - name: Upload Benchmark Artifacts (.json, .md, .html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            server_docs/stepped_benchmark_results.json
            audits/online_server_stress_test_final.md
            audits/online_server_stress_test_final.html

      - name: Commit and Push Updated Reports to Main
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add server_docs/ audits/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bench): update stress test reports [skip ci]" && git push origin main)
