name: MMO Cluster Stepped & Matrix Stress Test

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Режим тестирования (matrix-5000, stepped или single)'
        type: choice
        required: true
        default: 'matrix-5000'
        options:
          - 'matrix-5000'
          - 'stepped'
          - 'single'
      host:
        description: 'Целевой IP игрового сервера'
        required: true
        default: '93.77.168.135'
      port:
        description: 'Порт (строго 80)'
        required: true
        default: '80'
      bots:
        description: 'Количество CCU ботов (для single режима)'
        required: false
        default: '5000'
      town_bots:
        description: 'Количество ботов на площади города (сбор на площади, скамьи, чат)'
        required: false
        default: '120'
      start_ccu:
        description: 'Начальный онлайн ботов (для stepped режима)'
        required: false
        default: '1000'
      max_ccu:
        description: 'Максимальный онлайн ботов (для stepped режима)'
        required: false
        default: '5000'
      step_size:
        description: 'Шаг CCU (для stepped режима)'
        required: false
        default: '1000'
      duration:
        description: 'Длительность фазы нагрузки (секунд)'
        required: false
        default: '60'
      workers:
        description: 'Количество воркеров-генераторов'
        required: false
        default: '4'

permissions:
  contents: write

jobs:
  # ============================================================
  #  1. SINGLE / STEPPED РЕЖИМ (Одиночный раннер)
  # ============================================================
  run-stress-test:
    name: Run MMO Stress Test (${{ github.event.inputs.test_mode }})
    if: ${{ github.event.inputs.test_mode == 'single' || github.event.inputs.test_mode == 'stepped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install ws || npm install

      - name: Tune Linux TCP & Descriptors for 5000+ Sockets
        run: |
          ulimit -n 65535 || true
          sudo sysctl -w fs.file-max=2097152 || true
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535" || true
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1 || true

      - name: Run Single Stress Test (${{ github.event.inputs.bots }} CCU)
        if: ${{ github.event.inputs.test_mode == 'single' }}
        env:
          HOST: ${{ github.event.inputs.host }}
          PORT: ${{ github.event.inputs.port }}
          BOTS: ${{ github.event.inputs.bots }}
          DURATION: ${{ github.event.inputs.duration }}
          WORKERS: ${{ github.event.inputs.workers }}
          TOWN_BOTS: ${{ github.event.inputs.town_bots }}
          OUTPUT_FILE: benchmarks/stress_test_report.json
        run: |
          ulimit -n 65535 || true
          mkdir -p benchmarks server_docs audits
          echo "🚀 Запуск симуляции живого онлайна на $BOTS CCU ($TOWN_BOTS ботов на площади города)..."
          node scripts/stress-test-3000.js \
            --host="$HOST" \
            --port="$PORT" \
            --bots="$BOTS" \
            --duration="$DURATION" \
            --workers="$WORKERS" \
            --town-bots="$TOWN_BOTS" \
            --output="benchmarks/stress_test_report.json"

      - name: Run Stepped Benchmark (${{ github.event.inputs.start_ccu }} -> ${{ github.event.inputs.max_ccu }} CCU)
        if: ${{ github.event.inputs.test_mode == 'stepped' }}
        env:
          HOST: ${{ github.event.inputs.host }}
          PORT: ${{ github.event.inputs.port }}
          BENCH_START_CCU: ${{ github.event.inputs.start_ccu }}
          BENCH_MAX_CCU: ${{ github.event.inputs.max_ccu }}
          BENCH_STEP_SIZE: ${{ github.event.inputs.step_size }}
          BENCH_DURATION: ${{ github.event.inputs.duration }}
          TOWN_BOTS: ${{ github.event.inputs.town_bots }}
          NO_SSH: '1'
        run: |
          ulimit -n 65535 || true
          mkdir -p benchmarks server_docs audits
          echo "🚀 Запуск ступенчатого стресс-теста от $BENCH_START_CCU до $BENCH_MAX_CCU CCU ($TOWN_BOTS на площади)..."
          node scripts/run-stepped-benchmarks.js \
            --host="$HOST" \
            --port="$PORT" \
            --start-ccu="$BENCH_START_CCU" \
            --max-ccu="$BENCH_MAX_CCU" \
            --step-size="$BENCH_STEP_SIZE" \
            --duration="$BENCH_DURATION" \
            --town-bots="$TOWN_BOTS" \
            --no-ssh \
            --no-abort

      - name: Publish Step Summary to GitHub
        if: always()
        run: |
          echo "## 📊 Результаты Тестирования Нагрузки (Одиночный Раннер)" >> $GITHUB_STEP_SUMMARY
          echo "**Хост сервера:** \`${{ github.event.inputs.host }}:${{ github.event.inputs.port }}\`  " >> $GITHUB_STEP_SUMMARY
          echo "**Режим:** \`${{ github.event.inputs.test_mode }}\`  " >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "benchmarks/stress_test_report.json" ]; then
            echo "### 🟢 Сводка одиночного теста (Single Run)" >> $GITHUB_STEP_SUMMARY
            node -e '
              try {
                const r = JSON.parse(require("fs").readFileSync("benchmarks/stress_test_report.json", "utf8"));
                console.log("| Метрика | Значение |");
                console.log("|:---|:---|");
                console.log(`| Запрошено ботов | **${r.requestedBots}** |`);
                console.log(`| Подключено ботов | **${r.connected}** (${Math.round(r.connected / (r.requestedBots || 1) * 100)}%) |`);
                console.log(`| Ошибок сокетов | **${r.failed}** |`);
                console.log(`| Время тика сервера | **${r.tickMs != null ? r.tickMs.toFixed(2) + " мс" : "—"}** |`);
                console.log(`| EMA тика сервера | **${r.tickMsEma != null ? r.tickMsEma.toFixed(2) + " мс" : "—"}** |`);
                console.log(`| RTT p50 | **${r.rttP50 != null ? r.rttP50 + " мс" : "—"}** |`);
                console.log(`| RTT p95 | **${r.rttP95 != null ? r.rttP95 + " мс" : "—"}** |`);
                console.log(`| Длительность | **${r.durationSec} сек** |`);
              } catch (_) {}
            ' >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "benchmarks/benchmark_report.md" ]; then
            echo "### 📈 Отчёт ступенчатого тестирования" >> $GITHUB_STEP_SUMMARY
            cat benchmarks/benchmark_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Benchmark Artifacts (.json, .md, .html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/
            server_docs/
            audits/
          if-no-files-found: ignore

      - name: Commit and Push Updated Reports to Main
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add server_docs/ audits/ benchmarks/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bench): update stress test reports [skip ci]" && git push origin main || true)

  # ============================================================
  #  2. MATRIX-5000: 3 ПАРАЛЛЕЛЬНЫХ РАННЕРА (Байпас лимита 2048 SNAT портов)
  # ============================================================
  run-matrix-runner:
    name: Matrix Runner #${{ matrix.runner_id }} (${{ matrix.bots }} CCU, offset ${{ matrix.offset }})
    if: ${{ github.event.inputs.test_mode == 'matrix-5000' || github.event.inputs.test_mode == 'matrix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_id: 1
            bots: 1700
            offset: 0
            town_bots: 120
            workers: 2
          - runner_id: 2
            bots: 1700
            offset: 1700
            town_bots: 0
            workers: 2
          - runner_id: 3
            bots: 1600
            offset: 3400
            town_bots: 0
            workers: 2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install ws || npm install

      - name: Tune Linux TCP & Descriptors for Runner #${{ matrix.runner_id }}
        run: |
          ulimit -n 65535 || true
          sudo sysctl -w fs.file-max=2097152 || true
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535" || true
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1 || true

      - name: Run Matrix Generator (${{ matrix.bots }} CCU, offset ${{ matrix.offset }})
        run: |
          ulimit -n 65535 || true
          mkdir -p benchmarks
          echo "🚀 [Runner #${{ matrix.runner_id }}] Запуск ${{ matrix.bots }} ботов со смещением ${{ matrix.offset }}..."
          node scripts/stress-test-3000.js \
            --host="${{ github.event.inputs.host }}" \
            --port="${{ github.event.inputs.port }}" \
            --bots="${{ matrix.bots }}" \
            --offset="${{ matrix.offset }}" \
            --duration="${{ github.event.inputs.duration }}" \
            --workers="${{ matrix.workers }}" \
            --town-bots="${{ matrix.town_bots }}" \
            --output="benchmarks/matrix_runner_${{ matrix.runner_id }}.json"

      - name: Upload Matrix Runner #${{ matrix.runner_id }} Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-report-${{ matrix.runner_id }}
          path: benchmarks/matrix_runner_${{ matrix.runner_id }}.json
          if-no-files-found: ignore

  # ============================================================
  #  3. СВОДНЫЙ АГРЕГАТОР MATRIX РЕЗУЛЬТАТОВ (5000 CCU)
  # ============================================================
  aggregate-matrix:
    name: Aggregate Matrix 5000+ CCU Results
    needs: [run-matrix-runner]
    if: always() && (github.event.inputs.test_mode == 'matrix-5000' || github.event.inputs.test_mode == 'matrix')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download All Matrix Reports
        uses: actions/download-artifact@v4
        with:
          pattern: matrix-report-*
          path: benchmarks
          merge-multiple: true

      - name: Aggregate Reports and Query Server Telemetry
        run: |
          mkdir -p benchmarks
          node scripts/aggregate-matrix-benchmark.js \
            --host="${{ github.event.inputs.host }}" \
            --port="${{ github.event.inputs.port }}" \
            --reports-dir="benchmarks"

      - name: Upload Consolidated 5000+ CCU Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-5000-ccu-consolidated-report
          path: benchmarks/matrix_5000_ccu_report.*
          if-no-files-found: ignore

      - name: Commit and Push Consolidated Reports to Main
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/matrix_5000_ccu_report.* || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bench): update 5000 CCU matrix benchmark report [skip ci]" && git push origin main || true)
