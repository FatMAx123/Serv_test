<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Pratia</title>
  <script type="importmap">
  {
    "imports": {
      "three": "./js/libs/three.module.js",
      "three/addons/": "./js/libs/addons/"
    }
  }
  </script>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
    #canvas-container { width: 400px; height: 400px; border: 1px solid #444; }
    #info { padding: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <pre id="info">Loading...</pre>

  <script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    const info = document.getElementById('info');
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a2634);

    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(400, 400);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.8);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const texLoader = new THREE.TextureLoader();
    const tex = texLoader.load('assets/props/textures/matted_pratia.png', (t) => {
      t.colorSpace = THREE.SRGBColorSpace;
      t.needsUpdate = true;
      console.log('Texture loaded successfully!');
    });

    const loader = new FBXLoader();
    loader.setPath('assets/props/');
    loader.load('matted_pratia_a.fbx', (fbx) => {
      let debugStr = 'FBX Loaded:\n';
      
      fbx.traverse((o) => {
        if (o.isMesh) {
          debugStr += `Mesh: ${o.name}, vertices: ${o.geometry.attributes.position.count}\n`;
          if (o.geometry.attributes.color) {
            debugStr += `Found vertex colors! Count: ${o.geometry.attributes.color.count}. Deleting...\n`;
            o.geometry.deleteAttribute('color');
          }
          o.material = new THREE.MeshLambertMaterial({
            map: tex,
            color: new THREE.Color(0xffffff),
            side: THREE.DoubleSide,
            alphaTest: 0.3,
            depthWrite: true,
            transparent: false
          });
        }
      });

      scene.add(fbx);
      fbx.updateMatrixWorld(true);

      const bbox = new THREE.Box3().setFromObject(fbx);
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      bbox.getCenter(center);
      bbox.getSize(size);

      debugStr += `BBox min: ${bbox.min.toArray().map(v=>v.toFixed(2))}\n`;
      debugStr += `BBox max: ${bbox.max.toArray().map(v=>v.toFixed(2))}\n`;
      debugStr += `BBox size: ${size.toArray().map(v=>v.toFixed(2))}\n`;

      fbx.position.x = -center.x;
      fbx.position.y = -center.y;
      fbx.position.z = -center.z;

      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      let cameraDist = (maxDim / 2) / Math.tan(fov / 2);
      cameraDist *= 1.35;

      camera.position.set(cameraDist * 0.65, cameraDist * 0.75, cameraDist * 0.75);
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
      info.textContent = debugStr;
      window.__TEST_DONE = true;
    }, undefined, (err) => {
      info.textContent = 'Error loading FBX: ' + err.message;
    });
  </script>
</body>
</html>
